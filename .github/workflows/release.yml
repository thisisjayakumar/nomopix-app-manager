name: Android Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore release.keystore -alias nomopixkey -keyalg RSA -keysize 2048 -validity 10000 -storepass nomopixpass -keypass nomopixpass -dname "CN=Nomopix, OU=Apps, O=Nomopix, L=City, ST=State, C=US"

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Release App Bundle (.aab)
        run: ./gradlew bundleRelease --stacktrace

      - name: Prepare Release Binaries with Custom Names
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/release/*.apk release_assets/Nomopix-Manager_${{ github.ref_name }}.apk
          cp app/build/outputs/bundle/release/*.aab release_assets/Nomopix-Manager_${{ github.ref_name }}.aab

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Nomopix App Manager ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release_assets/Nomopix-Manager_${{ github.ref_name }}.apk
            release_assets/Nomopix-Manager_${{ github.ref_name }}.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
